<!doctype html><meta charset="utf-8"><title>selftest</title>
<pre id="out">running…</pre>
<iframe id="f" src="/?nostream#demo" style="width:1500px;height:950px"></iframe>
<script>
/* Loads the canvas in a frame and clicks its way through every control,
   printing what happened. It RESTORES what it changes: the models, styles
   and prompts it touches are put back, and the shot + style it creates are
   deleted again. An early version of the old harness did not restore, and
   quietly left ten models ticked on a shot. */
const log = [];
const wait = ms => new Promise(r => setTimeout(r, ms));
const FILM = 'demo';
const get = async () => (await fetch('/api/film/' + FILM)).json();
const post = (p, body) => fetch(p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
document.getElementById('f').onload = async () => {
  const win = document.getElementById('f').contentWindow, d = win.document;
  const q = s => d.querySelector(s), qa = s => [...d.querySelectorAll(s)];
  await wait(2500);
  if (!q('#crash').hidden) log.push('CRASH BANNER: ' + q('#crash').textContent);
  const before = await get();
  const strip = s => { const o = JSON.parse(JSON.stringify(s)); delete o.takes; return o; };
  const saved = before.shots.map(s => ({ id: s.id, clip: s.clip.models, frame: s.frame.models, styles: s.styles, fprompt: s.frame.prompt, cprompt: s.clip.prompt, order: before.shots.map(x => x.id), full: strip(s) }));
  const savedStyles = JSON.parse(JSON.stringify(before.styles || []));
  // `v` is the reference's cache version, derived from the file's mtime. Rewriting
  // a file with identical bytes still moves it, so comparing it is comparing the
  // clock, not the film — strip it from both sides like `takes` on a shot.
  const stripRefs = rs => (rs || []).map(r => { const o = Object.assign({}, r); delete o.v; return o; });
  const savedRefs = stripRefs(JSON.parse(JSON.stringify(before.refs || [])));
  const T = async (name, fn) => { try { log.push(name + ': ' + await fn()); } catch (e) { log.push(name + ': THREW ' + e.message); } };
  // dispatch on whatever is really under the point — a real pointer does
  const ptr = (_t, type, x, y, extra) => (d.elementFromPoint(x, y) || q('#canvas')).dispatchEvent(new win.PointerEvent(type, Object.assign({ bubbles: true, cancelable: true, clientX: x, clientY: y, pointerId: 1, button: 0, isPrimary: true, pointerType: 'mouse' }, extra || {})));
  const center = n => { const r = n.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };

  await T('boards = shots', async () => qa('.board:not(.adder)').length + ' boards for ' + before.shots.length + ' shots, adder=' + !!q('.board.adder'));
  await T('clicking a board makes it the bar target', async () => {
    const b = qa('.board:not(.adder)')[1]; const [x, y] = center(b.querySelector('.slots'));
    ptr(q('#canvas'), 'pointerdown', x, y); ptr(q('#canvas'), 'pointerup', x, y); await wait(200);
    return 'on=' + b.classList.contains('on') + ' target="' + q('#target').textContent.slice(0, 30) + '" prompt=' + q('#prompt').value.length + ' chars';
  });
  await T('Still / Clip switch swaps params + prompt', async () => {
    const a = q('#prompt').value.slice(0, 20);
    qa('.mode')[1].click(); await wait(150);
    const clipShown = !q('#clipParams').hidden && q('#clipParams').offsetParent !== null, frameHidden = q('#frameParams').offsetParent === null;
    const b = q('#prompt').value.slice(0, 20);
    qa('.mode')[0].click(); await wait(150);
    return 'clipParamsVisible=' + clipShown + ' frameParamsHidden=' + frameHidden + ' promptsDiffer=' + (a !== b) + ' backToStill=' + (q('#frameParams').offsetParent !== null);
  });
  await T('model picker popover toggles a chip', async () => {
    q('#pickModels').click(); await wait(250);
    const open = !q('#pop').hidden, chips = qa('#pop .chip-m').length;
    const first = qa('#pop .chip-m')[0]; const was = first.classList.contains('on');
    first.click(); await wait(600);
    const now = qa('#pop .chip-m')[0].classList.contains('on');
    qa('#pop .chip-m')[0].click(); await wait(600);
    const back = qa('#pop .chip-m')[0].classList.contains('on');
    d.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); await wait(150);
    return 'open=' + open + ' chips=' + chips + ' ' + was + '->' + now + '->' + back + ' closedOnEsc=' + q('#pop').hidden;
  });
  const esc = () => d.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  await T('the picker finds a model by its catalogue name, not only its id', async () => {
    esc(); await wait(120);
    if (!qa('.mode')[1].classList.contains('on')) { qa('.mode')[1].click(); await wait(400); }
    q('#pickModels').click(); await wait(400);
    const chips = () => qa('#pop .chip-m').map(c => c.textContent.trim());
    const f = q('#pop .filter');
    const byName = (v) => { f.value = v; f.dispatchEvent(new win.Event('input', { bubbles: true })); };
    byName('h3'); await wait(300);
    const hits = chips();
    byName('hailuo-3'); await wait(300);
    const byId = chips();
    byName(''); await wait(200);
    const named = qa('#pop .chip-m .nm').length;
    esc(); await wait(150);
    qa('.mode')[0].click(); await wait(300);
    // minimax/hailuo-3 is listed as "MiniMax: H3" — the id and the name share no words
    return '"h3" -> [' + hits.join(' | ') + '] | same by id=' + (JSON.stringify(hits) === JSON.stringify(byId)) +
           ' | chips showing a name=' + named;
  });

  await T('style chip toggles and saves', async () => {
    const chip = q('#barStyles .chip-m'); const was = chip.classList.contains('on');
    chip.click(); await wait(500);
    const srv = (await get()).shots[1].styles.length;
    q('#barStyles .chip-m').click(); await wait(500);
    return was + ' -> serverStyles=' + srv + ' -> back=' + (q('#barStyles .chip-m').classList.contains('on') === was);
  });
  await T('composed popover shows the real text', async () => {
    q('#composedBtn').click(); await wait(250);
    const t = (q('#pop .pop-composed') || {}).textContent || '';
    q('#composedBtn').click(); await wait(150);
    return 'chars=' + t.length + ' hasStyleHeader=' + t.includes('──') + ' closed=' + q('#pop').hidden;
  });
  await T('typing in the bar autosaves the shot', async () => {
    const ta = q('#prompt'); const orig = ta.value;
    ta.value = orig + ' EDITTOKEN'; ta.dispatchEvent(new win.Event('input')); await wait(900);
    const hit = (await get()).shots[1].frame.prompt.includes('EDITTOKEN');
    ta.value = orig; ta.dispatchEvent(new win.Event('input')); await wait(900);
    return 'saved=' + hit + ' restored=' + !(await get()).shots[1].frame.prompt.includes('EDITTOKEN');
  });
  await T('arm asks, cancel leaves it disarmed', async () => {
    q('#arm').click(); await wait(200);
    const asked = !q('#ask').hidden; q('#askNo').click(); await wait(200);
    return 'asked=' + asked + ' armed=' + q('#arm').dataset.armed + ' genLabel="' + q('#gen').textContent + '"';
  });
  await T('clicking a card selects it and opens the Take panel', async () => {
    q('#fit').click(); await wait(120);   // the still card may sit off-screen at 100%
    const c = qa('.card:not(.ghost)').find(x => x.querySelector('.kind') && x.querySelector('.kind').textContent === 'STILL') || q('.card:not(.ghost)'); const [x, y] = center(c.querySelector('.thumb'));
    ptr(q('#canvas'), 'pointerdown', x, y); ptr(q('#canvas'), 'pointerup', x, y); await wait(300);
    return 'sel=' + c.classList.contains('sel') + ' side=' + !q('#side').hidden + ' tab=' + (qa('.stab.on')[0] || {}).dataset?.t + ' sections=' + qa('#takePane .sec').length + ' acts=' + qa('#takePane .tk-acts button').length;
  });
  await T('card toolbar is present', async () => qa('.card.sel .ctools button').map(b => b.textContent).join(' | '));
  const repaint = async () => { q('#filmPick').dispatchEvent(new win.Event('change')); await wait(700); };
  const closeAll = async () => { for (let i = 0; i < 3; i++) { d.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); await wait(60); } };
  await T('drag a still onto the LAST slot promotes it', async () => {
    await closeAll(); q('#fit').click(); await wait(120);   // the Take panel would otherwise cover the slot
    const c = qa('.card:not(.ghost)').find(x => x.querySelector('.kind') && x.querySelector('.kind').textContent === 'STILL') || q('.card:not(.ghost)'); const [x, y] = center(c.querySelector('.thumb'));
    const own = c.dataset.shot; const s0 = (await get()).shots.find(x => x.id === own);
    const slot = q(`.board[data-id="${own}"] .slot[data-slot="last"]`); const [sx, sy] = center(slot);
    ptr(q('#canvas'), 'pointerdown', x, y); ptr(q('#canvas'), 'pointermove', x + 10, y + 10); ptr(q('#canvas'), 'pointermove', sx, sy);
    const over = slot.classList.contains('over'); ptr(q('#canvas'), 'pointerup', sx, sy); await wait(900);
    const s1 = (await get()).shots.find(x => x.id === own);
    // restore
    await post(`/api/film/${FILM}/shot/${s1.id}`, { last_frame: s0.last_frame }); await wait(600);
    return 'highlighted=' + over + ' lastFrame=' + s1.last_frame + ' restored=' + ((await get()).shots.find(x => x.id === own).last_frame === s0.last_frame);
  });
  await T('double-click opens the lightbox with a 1:1 mask canvas', async () => {
    // two quick taps through the real pointer path — a synthetic dblclick on the card would bypass the canvas capture
    await closeAll(); q('#fit').click(); await wait(120);
    const c = qa('.card:not(.ghost)').find(x => x.querySelector('.kind') && x.querySelector('.kind').textContent === 'STILL') || q('.card:not(.ghost)'); const [cx, cy] = center(c.querySelector('.thumb'));
    for (let i = 0; i < 2; i++) { ptr(null, 'pointerdown', cx, cy); ptr(null, 'pointerup', cx, cy); await wait(80); }
    await wait(800);
    const cv = q('#lbCanvas'), img = q('#lbImg');
    // paint a stroke on the mask — the only code path that touches the lightbox's pointer capture
    const cr = cv.getBoundingClientRect();
    for (const [fx, fy, type] of [[.3, .5, 'pointerdown'], [.45, .52, 'pointermove'], [.6, .55, 'pointermove'], [.6, .55, 'pointerup']])
      cv.dispatchEvent(new win.PointerEvent(type, { bubbles: true, cancelable: true, clientX: cr.left + cr.width * fx, clientY: cr.top + cr.height * fy, pointerId: 1, button: 0, isPrimary: true, pointerType: 'mouse' }));
    const px = (() => { const dd = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data; let n = 0; for (let i = 3; i < dd.length; i += 4) if (dd[i]) n++; return n; })();
    q('#lbClear').click();
    const r = 'open=' + !q('#lb').hidden + ' canvas=' + cv.width + 'x' + cv.height + ' img=' + img.naturalWidth + 'x' + img.naturalHeight + ' arrows=' + !q('#lbPrev').hidden + ' maskPixels=' + px + ' crashBanner=' + !q('#crash').hidden;
    d.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true })); await wait(400);
    const t2 = q('#lbTitle').textContent;
    d.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); await wait(200);
    return r + ' steppedTitle="' + t2.slice(0, 40) + '" closed=' + q('#lb').hidden;
  });
  await T('Esc deselects, then closes the panel', async () => {
    d.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); await wait(100);
    const a = qa('.card.sel').length;
    d.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); await wait(100);
    return 'selected=' + a + ' sideHidden=' + q('#side').hidden;
  });
  await T('styles panel: cards, autosave, duplicate, delete', async () => {
    q('#stylesBtn').click(); await wait(300);
    const cards = qa('.scard').length;
    const ta = q('.scard textarea'); const orig = ta.value;
    ta.value = orig + ' EDITTOKEN'; ta.dispatchEvent(new win.Event('input')); await wait(1200);
    const hit = (await get()).styles.some(s => (s.prompt || '').includes('EDITTOKEN'));
    ta.value = orig; ta.dispatchEvent(new win.Event('input')); await wait(1200);
    const n0 = (await get()).styles.length;
    q('.scard .foot button').click(); await wait(1500);
    const n1 = (await get()).styles.length;
    const dupId = (await get()).styles.map(x => x.id).find(id => !savedStyles.some(x => x.id === id));
    const dupCard = qa('.scard').find(c => c.querySelector('code, .used') && (c.textContent.includes(dupId) || c.querySelector('input').value.endsWith(' copy')));
    if (!dupCard) return 'duplicate card not found — nothing deleted (styles now ' + (await get()).styles.map(x => x.id).join(',') + ')';
    dupCard.querySelectorAll('.foot button')[1].click(); await wait(300);
    q('#askYes').click(); await wait(1500);
    const n2 = (await get()).styles.length;
    q('#sideClose').click(); await wait(150);
    return 'cards=' + cards + ' saved=' + hit + ' restored=' + !(await get()).styles.some(s => (s.prompt || '').includes('EDITTOKEN')) + ' ' + n0 + '->dup ' + n1 + '->del ' + n2;
  });
  await T('+ shot creates a board, menu deletes it again', async () => {
    q('.board.adder').click(); await wait(200);
    q('#askInput').value = 'Selftest shot'; q('#askYes').click(); await wait(1200);
    const made = qa('.board:not(.adder)').length;
    const b = q('.board[data-id^="selftest-shot"]');
    if (!b) return 'board not created';
    b.querySelector('.bhead button').click(); await wait(200);
    const menu = qa('#pop .menu button').map(x => x.textContent).join(' | ');
    qa('#pop .menu button').find(x => x.textContent.startsWith('delete shot')).click(); await wait(200);
    q('#askYes').click(); await wait(1200);
    return 'boards ' + before.shots.length + ' -> ' + made + ' -> ' + qa('.board:not(.adder)').length + ' · menu: ' + menu;
  });
  await T('board drag reorders and the order is saved', async () => {
    await closeAll(); q('#fit').click(); await wait(100);   // + shot centred the view far right; bring every board on screen
    const boards = qa('.board:not(.adder)');
    const b0 = boards[0], b1 = boards[1];
    const [x, y] = center(b0.querySelector('.bhead .num'));
    const [tx] = center(b1.querySelector('.bhead .num'));
    ptr(q('#canvas'), 'pointerdown', x, y); ptr(q('#canvas'), 'pointermove', x + 10, y); ptr(q('#canvas'), 'pointermove', tx + 200, y);
    const lifting = b0.classList.contains('lifting') || !!q('.board.lifting'); ptr(q('#canvas'), 'pointerup', tx + 200, y); await wait(1200);
    const order = (await get()).shots.map(s => s.id);
    await post(`/api/film/${FILM}/reorder`, { order: saved[0].order }); await wait(800);
    return 'lifted=' + lifting + ' newOrder=' + order.join(',') + ' restored=' + (JSON.stringify((await get()).shots.map(s => s.id)) === JSON.stringify(saved[0].order));
  });
  await T('double-tap on the background fits', async () => {
    await closeAll(); q('#zoomIn').click(); await wait(50);
    const t0 = q('#world').style.transform;
    const r = q('#canvas').getBoundingClientRect(); const x = r.left + 20, y = r.bottom - 40;   // bottom-left corner: no board there
    for (let i = 0; i < 2; i++) { ptr(null, 'pointerdown', x, y); ptr(null, 'pointerup', x, y); await wait(60); }
    await wait(100);
    return 'changed=' + (t0 !== q('#world').style.transform) + ' pct=' + q('#zoomPct').textContent;
  });
  await T('reference: from a take, wired to a board, chip toggles, removed again', async () => {
    const film = await get();
    const src = film.shots.map(s => ({ s, t: s.takes.find(t => t.ext !== '.mp4') })).find(x => x.t);
    if (!src) return 'no still to make a reference from';
    const n0 = qa('.refcard').length, w0 = qa('#wires path').length;
    const r = await (await post(`/api/film/${FILM}/refs`, { from_take: { shot: src.s.id, take: src.t.id }, name: 'selftest ref', tag: 'Take the texture from this image.', link: [src.s.id] })).json();
    await repaint();
    const n1 = qa('.refcard').length, w1 = qa('#wires path').length;
    // the bar chip for the active shot toggles the link
    const chip = qa('#barRefs .chip-m').find(c => c.textContent.includes('selftest ref'));
    let toggled = 'no chip';
    if (chip) { const was = chip.classList.contains('on'); chip.click(); await wait(500); const now = qa('#barRefs .chip-m').find(c => c.textContent.includes('selftest ref')).classList.contains('on'); toggled = was + '->' + now; qa('#barRefs .chip-m').find(c => c.textContent.includes('selftest ref')).click(); await wait(500); }
    // the composed preview carries the numbered block for the linked shot
    d.querySelector(`.board[data-id="${src.s.id}"] .slots`).dispatchEvent(new win.PointerEvent('pointerdown', { bubbles: true, clientX: 0, clientY: 0, pointerId: 1, button: 0 }));
    d.querySelector('#canvas').dispatchEvent(new win.PointerEvent('pointerup', { bubbles: true, clientX: 0, clientY: 0, pointerId: 1, button: 0 })); await wait(150);
    q('#composedBtn').click(); await wait(200);
    const block = ((q('#pop .pop-composed') || {}).textContent || '').includes('Reference images are attached');
    q('#composedBtn').click(); await wait(100);
    await post(`/api/film/${FILM}/refs`, { id: r.ref.id, delete: true }); await repaint();
    return `nodes ${n0}->${n1}->${qa('.refcard').length} · wires ${w0}->${w1}->${qa('#wires path').length} · chip ${toggled} · composedBlock=${block}`;
  });
  await T('zoom controls + fit change the transform', async () => {
    const t0 = q('#world').style.transform; q('#zoomIn').click(); await wait(50);
    const t1 = q('#world').style.transform; q('#fit').click(); await wait(50);
    return 'pct=' + q('#zoomPct').textContent + ' changed=' + (t0 !== t1) + ' fitChanged=' + (t1 !== q('#world').style.transform);
  });
  // ---- deleting, the film menu, free placement, scrolling inside a node ----
  const pev = (type, x, y, extra) => new win.PointerEvent(type, Object.assign({ bubbles: true, cancelable: true, clientX: x, clientY: y, pointerId: 1, button: 0, isPrimary: true, pointerType: 'mouse' }, extra || {}));
  const slide = (x, y) => q('#canvas').dispatchEvent(pev('pointermove', x, y));
  const key = k => d.dispatchEvent(new win.KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
  const setActive = id => win.setActive(id);
  const addShot = async title => {
    q('.board.adder').click(); await wait(200);
    q('#askInput').value = title; q('#askYes').click(); await wait(1200);
    q('#prompt').blur();                       // + shot lands you in the prompt; keys are ignored while typing
    await wait(80);
    return q('.board[data-id^="' + title.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '"]');
  };

  await T('? lists the keyboard shortcuts', async () => {
    await closeAll(); key('?'); await wait(220);
    const rows = qa('#pop .krow').length;
    key('Escape'); await wait(150);
    return rows + ' shortcuts, closedOnEsc=' + q('#pop').hidden;
  });

  await T('film menu offers new, rename and delete', async () => {
    q('#filmMenu').click(); await wait(220);
    const labels = qa('#pop .menu button').map(b => b.textContent.trim());
    const danger = qa('#pop .menu button.danger').length;
    await closeAll();
    return '[' + labels.join(' | ') + '] danger=' + danger;
  });

  await T('the ✕ on a board head deletes that shot', async () => {
    const b = await addShot('Selftest ex');
    if (!b) return 'board not created';
    const n0 = qa('.board:not(.adder)').length;
    b.querySelector('.bhead .bdel').click(); await wait(300);
    const asked = !q('#ask').hidden;
    q('#askYes').click(); await wait(1300);
    return 'asked=' + asked + ' boards ' + n0 + ' -> ' + qa('.board:not(.adder)').length;
  });

  await T('Del deletes the active shot when no take is selected', async () => {
    const b = await addShot('Selftest key');
    if (!b) return 'board not created';
    const n0 = qa('.board:not(.adder)').length;
    key('Delete'); await wait(300);
    const asked = !q('#ask').hidden;
    q('#askNo').click(); await wait(400);
    const kept = qa('.board:not(.adder)').length;
    key('Delete'); await wait(300);
    q('#askYes').click(); await wait(1300);
    return 'asked=' + asked + ' cancelKept=' + (kept === n0) + ' boards ' + n0 + ' -> ' + qa('.board:not(.adder)').length;
  });

  await T('a downward drag frees the layout, tidy puts the row back', async () => {
    await closeAll(); q('#fit').click(); await wait(400);
    const b = qa('.board:not(.adder)')[0];
    const [x, y] = center(b.querySelector('.bhead .num'));
    const under = d.elementFromPoint(x, y);
    if (!under || !under.closest('.bhead')) return 'could not grab a board head (' + (under && under.className) + ')';
    ptr(q('#canvas'), 'pointerdown', x, y); await wait(50);
    for (const dy of [60, 180, 320]) { slide(x + 20, y + dy); await wait(50); }
    q('#canvas').dispatchEvent(pev('pointerup', x + 20, y + 320)); await wait(1000);
    const placed = (await get()).shots.filter(s => s.x != null).length;
    const order = (await get()).shots.map(s => s.id).join(',');
    q('#filmMenu').click(); await wait(220);
    const tidy = qa('#pop .menu button').find(z => /tidy/.test(z.textContent));
    if (!tidy) { await closeAll(); return 'placed=' + placed + ' but no tidy item appeared'; }
    tidy.click(); await wait(900);
    return 'placed=' + placed + '/' + (await get()).shots.length + ' orderKept=' + (order === (await get()).shots.map(s => s.id).join(',')) +
           ' afterTidy=' + (await get()).shots.filter(s => s.x != null).length;
  });

  await T('a long note scrolls instead of panning the canvas', async () => {
    const note = qa('.board:not(.adder) .bnote')[0];
    const keep = note.value;
    note.value = 'a long line of note text that wraps and wraps and wraps. '.repeat(60);
    note.dispatchEvent(new win.Event('input', { bubbles: true })); await wait(400);
    const overflow = note.style.overflowY;
    const before = win.getComputedStyle(q('#world')).transform;
    const [x, y] = center(note);
    note.dispatchEvent(new win.WheelEvent('wheel', { bubbles: true, cancelable: true, clientX: x, clientY: y, deltaY: 120 }));
    await wait(250);
    const panned = win.getComputedStyle(q('#world')).transform !== before;
    q('#canvas').dispatchEvent(new win.WheelEvent('wheel', { bubbles: true, cancelable: true, clientX: 30, clientY: 700, deltaY: 120 }));
    await wait(250);
    const bgPans = win.getComputedStyle(q('#world')).transform !== before;
    note.value = keep; note.dispatchEvent(new win.Event('input', { bubbles: true })); await wait(900);
    return 'overflowY=' + overflow + ' pannedUnderTheText=' + panned + ' backgroundStillPans=' + bgPans;
  });

  await T('the still params offer only what the picked model accepts', async () => {
    await closeAll();
    if (!qa('.mode')[0].classList.contains('on')) { qa('.mode')[0].click(); await wait(300); }
    const models = qa('#barModels .chip-m.on').map(c => c.textContent.replace(/×$/, '').trim());
    const cat = (await (await fetch('/api/models/image')).json()).models;
    const lim = id => (cat.find(m => id && m.id.endsWith(id)) || {}).limits || {};
    const first = lim(models[0]);
    const res = [...q('#frameResolution').options].map(o => o.value).filter(Boolean);
    const nMax = q('#frameN').max, nOff = q('#frameN').disabled;
    const wantN = (first.n || [1, 4])[1];
    const wantRes = first.resolution || [];
    return 'model=' + models.join(',') +
      ' | n max=' + nMax + ' (published ' + wantN + ') disabled=' + nOff + ' correct=' + (Number(nMax) === wantN && nOff === (wantN === 1)) +
      ' | res offered=[' + res.join(',') + '] published=[' + wantRes.join(',') + '] correct=' + (JSON.stringify(res) === JSON.stringify(wantRes));
  });

  await T('a resolution outside the model limits is pulled back, not sent', async () => {
    const sid = before.shots[0].id;
    await post(`/api/film/${FILM}/shot/${sid}`, { frame: { resolution: 'NOT-A-RESOLUTION', n: 9 } });
    await wait(300);
    const bad = (await get()).shots.find(x => x.id === sid).frame;
    // ?nostream means the page never hears about a server-side change, so reopen
    // the film — which is also the real case: a bad value stored before you look
    await win.openFilm(FILM); await wait(1800);
    const now = (await get()).shots.find(x => x.id === sid).frame;
    return 'stored bad {n:' + bad.n + ', res:' + JSON.stringify(bad.resolution) + '}' +
           ' -> clamped {n:' + now.n + ', res:' + JSON.stringify(now.resolution) + '}' +
           ' toast="' + q('#toast').textContent.slice(0, 54) + '"';
  });

  await T('ctrl + drag picks a node up from anywhere on it', async () => {
    await closeAll();
    await post(`/api/film/${FILM}/layout`, { reset: true });
    await win.openFilm(FILM); await wait(1200);
    q('#fit').click(); await wait(500);
    const b = qa('.board:not(.adder)')[0];
    const br = b.getBoundingClientRect();
    const x = br.left + br.width * 0.5, y = br.top + 70;      // below the head, in the body
    const under = d.elementFromPoint(x, y);
    if (!under || !under.closest('.board')) return 'did not land on the board (' + (under && under.tagName) + ')';
    if (under.closest('.bhead')) return 'landed on the head, which already worked';
    under.dispatchEvent(pev('pointerdown', x, y, { ctrlKey: true })); await wait(60);
    for (const dy of [70, 180, 300]) { q('#canvas').dispatchEvent(pev('pointermove', x + 90, y + dy)); await wait(50); }
    q('#canvas').dispatchEvent(pev('pointerup', x + 90, y + 300)); await wait(1000);
    const moved = (await get()).shots.filter(sh => sh.x != null).length;
    // and the same spot without ctrl must still belong to whatever is under it
    const was = (await get()).shots.find(sh => sh.id === b.dataset.id);
    d.elementFromPoint(x, y).dispatchEvent(pev('pointerdown', x, y)); await wait(60);
    for (const dy of [80, 200]) { q('#canvas').dispatchEvent(pev('pointermove', x + 60, y + dy)); await wait(50); }
    q('#canvas').dispatchEvent(pev('pointerup', x + 60, y + 200)); await wait(800);
    const now = (await get()).shots.find(sh => sh.id === b.dataset.id);
    await post(`/api/film/${FILM}/layout`, { reset: true });
    await win.openFilm(FILM); await wait(900);
    return 'grabbed <' + under.tagName.toLowerCase() + '> | placed=' + moved + '/' + (await get()).shots.length +
           ' | without ctrl unchanged=' + (was.x === now.x && was.y === now.y);
  });

  await T('double-click a reference opens it, and its name and tag save there', async () => {
    await closeAll();
    const th = q('.refcard .rthumb');
    if (!th) return 'no reference on this film';
    const rid = th.closest('.refcard').dataset.ref;
    const was = (await get()).refs.find(r => r.id === rid);
    const [x, y] = center(th);
    for (let i = 0; i < 2; i++) { d.elementFromPoint(x, y).dispatchEvent(pev('pointerdown', x, y)); q('#canvas').dispatchEvent(pev('pointerup', x, y)); }
    await wait(600);
    const opened = 'open=' + !q('#lb').hidden + ' refFoot=' + !q('#lbRefFoot').hidden +
                   ' editFoot=' + !q('#lbFoot').hidden + ' mask=' + (win.getComputedStyle(q('#lbMaskTools')).display !== 'none');
    q('#lbRefTag').value = 'SELFTEST TAG'; q('#lbRefSave').click(); await wait(900);
    const mid = (await get()).refs.find(r => r.id === rid);
    q('#lbRefTag').value = was.tag || ''; q('#lbRefName').value = was.name || '';
    q('#lbRefSave').click(); await wait(900);
    const back = (await get()).refs.find(r => r.id === rid);
    key('Escape'); await wait(300);
    return opened + ' | tag saved=' + (mid.tag === 'SELFTEST TAG') +
           ' restored=' + (back.tag === (was.tag || '') && back.name === (was.name || '')) +
           ' closedOnEsc=' + q('#lb').hidden;
  });

  await T('replacing a reference picture repaints the card and the chip', async () => {
    await closeAll();
    const card = q('.refcard'); if (!card) return 'no reference on this film';
    const rid = card.dataset.ref;
    const was = (await get()).refs.find(r => r.id === rid);
    // the pixel a rendered <img> is really showing, not what its src says
    const pixelOf = async src => {
      const im = new win.Image(); im.src = src;
      await new Promise(r => { im.onload = r; im.onerror = r; });
      const c = d.createElement('canvas'); c.width = c.height = 1;
      const g = c.getContext('2d'); g.drawImage(im, 0, 0, 1, 1);
      return [...g.getImageData(0, 0, 1, 1).data].slice(0, 3).join(',');
    };
    const asDataUrl = async url => {
      const b = await (await fetch(url)).blob();
      return new Promise(r => { const rd = new win.FileReader(); rd.onload = () => r(rd.result); rd.readAsDataURL(b); });
    };
    // keep the original bytes so this step can put the picture back exactly
    const original = await asDataUrl('/media/' + FILM + '/' + was.file + '?snapshot=' + Date.now());
    const before = await pixelOf(card.querySelector('img').src);
    const blue = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAIAAABLbSncAAAAEUlEQVR4nGOQs7mDFTEMLQkAGQpNgZweqk4AAAAASUVORK5CYII=';   // 8x8 solid blue, generated and round-tripped
    // this step overwrites a file that is committed to the repo, so the original
    // bytes go back even when an assertion above them blows up
    let cardPix, chipPix, versioned;
    try {
      await post(`/api/film/${FILM}/refs`, { id: rid, data: blue });
      await win.openFilm(FILM); await wait(1200);
      const img = q(`.refcard[data-ref="${rid}"] img`), chip = q('#barRefs .chip-m img');
      cardPix = await pixelOf(img.src);
      chipPix = chip ? await pixelOf(chip.src) : 'no chip';
      versioned = /\?v=\d+/.test(img.src);
    } finally {
      await post(`/api/film/${FILM}/refs`, { id: rid, data: original });
      await win.openFilm(FILM); await wait(1000);
    }
    const restored = await pixelOf(q(`.refcard[data-ref="${rid}"] img`).src);
    return 'card ' + before + ' -> ' + cardPix + ' | chip ' + chipPix +
           ' | repainted=' + (cardPix !== before && chipPix !== before) +
           ' | versioned=' + versioned + ' | restored=' + (restored === before);
  });

  await T('linking a reference leaves its grip alone', async () => {
    const n = q('.refcard');
    if (!n) return 'no reference on this film';
    const chip = qa('#barRefs .chip-m').find(c => c.textContent.trim().length);
    if (!chip) return 'no reference chip in the bar';
    const before = n.querySelector('.used').textContent.slice(0, 26);
    chip.click(); await wait(900);
    const mid = n.querySelector('.grip').textContent + ' / ' + n.querySelector('.used').textContent.slice(0, 26);
    chip.click(); await wait(900);
    return 'used "' + before + '" -> "' + mid + '" gripIntact=' + (n.querySelector('.grip').textContent === '⠿');
  });

  await T('the bar folds full -> compact -> strip -> hidden, and stops there', async () => {
    await closeAll();
    const bar = q('#bar'), fold = q('#barFold'), up = q('#barUnfold'), state = () => bar.className || 'full';
    for (let i = 0; i < 4; i++) { up.click(); await wait(150); }
    const seen = [state()], shows = [];
    for (let i = 0; i < 4; i++) {
      fold.click(); await wait(220);
      seen.push(state());
      // #bar is position:fixed, so offsetParent is always null — ask for display
      shows.push(state() + ': bar=' + (win.getComputedStyle(bar).display !== 'none') +
        ' cfg=' + (q('.bar-row.cfg').offsetParent !== null) +
        ' opts=' + (q('#barStyles').offsetParent !== null) +   // #barOpt is display:contents — measure a child
        ' prompt=' + (q('#prompt').offsetParent !== null) +
        ' gen=' + (q('#gen').offsetParent !== null) +
        ' showBtn=' + !q('#barShow').hidden +
        ' up/down enabled=' + !up.disabled + '/' + !fold.disabled +
        ' sum=' + (q('#barSummary').textContent.trim().length > 0));
    }
    return seen.join(' -> ') + '  ||  ' + shows.join('  ||  ');
  });

  await T('the fold controls stay in the corner however the chips wrap', async () => {
    const bar = q('#bar'), fold = q('#barFold'), up = q('#barUnfold');
    for (let i = 0; i < 4; i++) { up.click(); await wait(150); }
    const br = bar.getBoundingClientRect(), fr = fold.getBoundingClientRect(), ur = up.getBoundingClientRect();
    return 'inTopRight=' + (br.right - fr.right < 24 && fr.top - br.top < 24) +
           ' sideBySide=' + (Math.abs(ur.top - fr.top) < 2 && fr.left >= ur.right - 1) +
           ' (bar right/top ' + Math.round(br.right) + '/' + Math.round(br.top) +
           ', fold ' + Math.round(fr.right) + '/' + Math.round(fr.top) + ')';
  });

  await T('unfold goes back one step, not the long way round', async () => {
    const bar = q('#bar'), fold = q('#barFold'), up = q('#barUnfold'), state = () => bar.className || 'full';
    for (let i = 0; i < 4; i++) { up.click(); await wait(130); }
    const atTop = state() + ' upDisabled=' + up.disabled;
    fold.click(); await wait(180); fold.click(); await wait(180);     // -> folded
    const down2 = state();
    up.click(); await wait(200);
    const back1 = state();
    up.click(); await wait(200);
    const back2 = state() + ' upDisabled=' + q('#barUnfold').disabled;
    for (let i = 0; i < 4; i++) { q('#barUnfold').click(); await wait(130); }
    return 'at full: ' + atTop + ' | two folds -> ' + down2 + ' | one unfold -> ' + back1 + ' | another -> ' + back2;
  });

  await T('/ opens a hidden bar rather than focusing nothing', async () => {
    const fold = q('#barFold'), bar = q('#bar');
    for (let i = 0; i < 4 && bar.className !== 'gone'; i++) { fold.click(); await wait(150); }
    const wasFolded = bar.className === 'gone';
    key('/'); await wait(250);
    const focused = d.activeElement === q('#prompt') || q('#prompt').offsetParent !== null;
    q('#prompt').blur();
    for (let i = 0; i < 4 && bar.className !== ''; i++) { fold.click(); await wait(150); }
    return 'startedHidden=' + wasFolded + ' promptReachable=' + focused + ' backToFull=' + (bar.className === '');
  });

  await T('stitch reports cleanly', async () => { q('#stitch').click(); await wait(2500); const t = q('#toast').textContent; if (!q('#lb').hidden) d.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); return '"' + t.slice(0, 70) + '"'; });

  // Put the film back EXACTLY as found, and say what had to be repaired — a repair
  // here means a step above did something it should not have.
  const repairs = [];
  let cur = await get();
  for (const st of savedStyles) if (!cur.styles.some(x => x.id === st.id)) { repairs.push('style ' + st.id + ' was missing'); await post(`/api/film/${FILM}/styles`, st); }
  for (const st of cur.styles) if (!savedStyles.some(x => x.id === st.id)) { repairs.push('style ' + st.id + ' was extra'); await post(`/api/film/${FILM}/styles`, { id: st.id, delete: true }); }
  for (const st of savedStyles) await post(`/api/film/${FILM}/styles`, { id: st.id, name: st.name, prompt: st.prompt, note: st.note || '' });
  cur = await get();
  for (const r of cur.refs || []) if (!savedRefs.some(x => x.id === r.id)) { repairs.push('ref ' + r.id + ' was extra'); await post(`/api/film/${FILM}/refs`, { id: r.id, delete: true }); }
  cur = await get();
  for (const s of saved) if (!cur.shots.some(x => x.id === s.id)) { repairs.push('shot ' + s.id + ' was missing'); await post(`/api/film/${FILM}/shots`, { id: s.id, title: s.full.title }); }
  for (const x of cur.shots) if (!saved.some(s => s.id === x.id)) { repairs.push('shot ' + x.id + ' was extra'); await post(`/api/film/${FILM}/shot/${x.id}/delete`); }
  for (const s of saved) { const f = s.full; const body = { title: f.title, note: f.note, first_frame: f.first_frame, last_frame: f.last_frame, selected_take: f.selected_take, styles: f.styles, clip: f.clip, frame: f.frame }; if ('refs' in f) body.refs = f.refs; await post(`/api/film/${FILM}/shot/${s.id}`, body); }
  await post(`/api/film/${FILM}/reorder`, { order: saved.map(s => s.id) });
  // free placement lives outside the shot PATCH, so put it back on its own
  const wantXY = {}, wantRefXY = {};
  for (const s of saved) if (s.full.x != null) wantXY[s.id] = [s.full.x, s.full.y];
  for (const r of savedRefs) if (r.x != null) wantRefXY[r.id] = [r.x, r.y];
  await post(`/api/film/${FILM}/layout`, { reset: true });
  // re-applying it is restoration, not a repair — the free-placement step tidies on purpose
  if (Object.keys(wantXY).length || Object.keys(wantRefXY).length) await post(`/api/film/${FILM}/layout`, { shots: wantXY, refs: wantRefXY });
  const after = await get();
  const same = JSON.stringify(after.shots.map(strip)) === JSON.stringify(saved.map(s => s.full))
            && JSON.stringify(after.styles) === JSON.stringify(savedStyles)
            && JSON.stringify(stripRefs(after.refs)) === JSON.stringify(savedRefs);
  log.push('film restored: ' + same + ' · shots ' + after.shots.map(s => s.id).join(',') + ' · styles ' + after.styles.map(s => s.id).join(','));
  if (!same) {
    // "restored: false" on its own tells you nothing — name the fields that drifted
    const drift = [];
    after.shots.map(strip).forEach((now, i) => {
      const was = saved[i] && saved[i].full; if (!was) { drift.push('extra shot ' + now.id); return; }
      for (const k of new Set([...Object.keys(now), ...Object.keys(was)]))
        if (JSON.stringify(now[k]) !== JSON.stringify(was[k]))
          drift.push(now.id + '.' + k + ': ' + JSON.stringify(was[k]).slice(0, 160) + "  ->  " + JSON.stringify(now[k]).slice(0, 160));
    });
    if (JSON.stringify(after.styles) !== JSON.stringify(savedStyles)) drift.push('styles differ');
    if (JSON.stringify(stripRefs(after.refs)) !== JSON.stringify(savedRefs)) drift.push('refs differ');
    log.push('  drift: ' + (drift.join(' · ') || 'shot order or count'));
  }
  log.push(repairs.length ? 'REPAIRS NEEDED (a step above misbehaved): ' + repairs.join('; ') : 'no repairs needed');
  document.getElementById('out').textContent = log.join('\n');
};
</script>
