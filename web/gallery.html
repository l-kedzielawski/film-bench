<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>film-bench · gallery</title>
<link rel="stylesheet" href="/web/style.css">
<style>
/* The gallery is its own page rather than a panel: what it is for — finding the
   one good still you remember from last week — is the opposite of the canvas,
   which is deliberately one shot at a time. */
body{overflow:auto}
#gtop{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:9px 14px;background:rgba(14,15,17,.96);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
#gtop .brand{font:600 14px/1 var(--mono);color:var(--dim);letter-spacing:.02em}
#gtop .brand b{color:var(--ink)}
#gsearch{width:min(320px,40vw);font-size:12.5px;padding:5px 9px;background:var(--panel2);border-color:var(--line)}
#gtop select{font:11px/1 var(--mono);padding:5px 6px;background:var(--panel2);color:var(--ink);
  border:1px solid var(--line);border-radius:5px}
#gcount{font:11px/1 var(--mono);color:var(--faint)}
#grid{display:grid;gap:14px;padding:16px;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
/* align-self:start and a thumbnail that will not flex: otherwise the grid
   stretches every card to the tallest in its row and the picture boxes go
   ragged, which is the one thing a wall of pictures must not do */
.g{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;
  display:flex;flex-direction:column;align-self:start;transition:border-color .12s,transform .12s}
.g:hover{border-color:var(--line2);transform:translateY(-1px)}
.g.fav{border-color:var(--warn)}
/* a definite height, not aspect-ratio: an aspect-ratio box whose child is
   height:100% is circular inside a flex column, and the rows come out ragged */
.g .th{position:relative;height:200px;flex:none;background:#000;overflow:hidden;
  display:grid;place-items:center;cursor:zoom-in}
/* max-* rather than width/height 100%: the picture is centred and never larger
   than its box, whatever shape it came out of the model */
.g .th img,.g .th video{max-width:100%;max-height:100%;width:auto;height:auto;display:block}
.g .star{position:absolute;top:6px;right:6px;z-index:2;width:26px;height:26px;padding:0;
  border-radius:13px;background:rgba(10,12,14,.72);border:1px solid var(--line2);
  color:var(--faint);font-size:13px;line-height:1;display:grid;place-items:center}
.g .star:hover{color:var(--warn);border-color:var(--warn)}
.g.fav .star{color:var(--warn);border-color:var(--warn);background:#2a2416}
.g .kind{position:absolute;top:6px;left:6px;z-index:2;font:600 9px/1 var(--mono);
  color:var(--dim);background:rgba(10,12,14,.75);border-radius:3px;padding:3px 5px;letter-spacing:.08em}
.g .meta{padding:8px 9px;display:flex;flex-direction:column;gap:4px;min-width:0}
.g .row{display:flex;align-items:center;gap:6px;min-width:0}
.g .m{font:11px/1.3 var(--mono);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g .sub{font:10px/1.4 var(--mono);color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g .cost{color:var(--acc);font:10px/1 var(--mono);flex:none}
.g .acts{display:flex;gap:4px;padding:0 9px 9px}
.g .acts button{font-size:10px;padding:3px 6px}
#gempty{padding:60px 20px;text-align:center;color:var(--faint);font-size:13px}
#glb{position:fixed;inset:0;z-index:90;background:rgba(6,7,9,.96);display:none;
  flex-direction:column;padding:14px}
#glb.on{display:flex}
#glb .bar{display:flex;align-items:center;gap:10px;padding-bottom:10px}
#glb .stage{flex:1;min-height:0;display:grid;place-items:center}
#glb img,#glb video{max-width:100%;max-height:100%;border-radius:4px}
#glb .pr{font:11px/1.6 var(--mono);color:var(--dim);max-height:22vh;overflow:auto;
  white-space:pre-wrap;padding-top:10px;border-top:1px solid var(--line);margin-top:10px}
</style>

<div id="gtop">
  <a class="brand" href="/">film<b>bench</b></a>
  <a class="ghost" href="/" style="padding:4px 9px">← canvas</a>
  <input id="gsearch" placeholder="model, style, shot, film, prompt…">
  <select id="gfilm"><option value="">every film</option></select>
  <select id="gmodel"><option value="">every model</option></select>
  <select id="gkind"><option value="">stills and clips</option><option value="img">stills</option><option value="vid">clips</option></select>
  <button id="gfav" class="ghost">★ favourites</button>
  <span class="grow"></span>
  <span id="gcount"></span>
</div>
<div id="grid"></div>
<p id="gempty" hidden></p>

<div id="glb">
  <div class="bar">
    <b id="glbTitle"></b>
    <span class="grow"></span>
    <button id="glbName" class="ghost">copy name</button>
    <button id="glbPath" class="ghost">copy path</button>
    <a id="glbOpen" class="ghost" style="padding:4px 9px">open in the canvas</a>
    <button id="glbClose" class="ghost">close ✕</button>
  </div>
  <div class="stage"><img id="glbImg" hidden><video id="glbVid" controls hidden></video></div>
  <div class="pr" id="glbPrompt"></div>
</div>
<div id="toast" hidden></div>
<script src="/web/gallery.js"></script>
